<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The Ripple logo (see src/components/logo.tsx): a coral rounded square with rings
       spreading from a drop in the lower-left corner and running off the edges. -->
  <defs>
    <clipPath id="tile"><rect width="32" height="32" rx="8"/></clipPath>
  </defs>
  <rect width="32" height="32" rx="8" fill="#dc532d"/>
  <g clip-path="url(#tile)" fill="none" stroke="#fefbf8" stroke-width="3">
    <circle cx="9" cy="23" r="7"/>
    <circle cx="9" cy="23" r="14" opacity="0.7"/>
    <circle cx="9" cy="23" r="21" opacity="0.45"/>
  </g>
  <circle cx="9" cy="23" r="2.6" fill="#fefbf8"/>
</svg>
